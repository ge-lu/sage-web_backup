<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aura AI</title>
  <!-- <script src="https://cdn.tailwindcss.com"></script> -->
  <script src="tailwindcss.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            neon: '#10B981',
            'bg-soft': '#F6F8F6',
            'card-white': '#FFFFFF',
            'text-main': '#1F2937',
            'text-sub': '#6B7280',
          },
          boxShadow: {
            'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
            'card': '0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02)',
          }
        }
      }
    }
  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* Clean Green Theme */
      --bg-app: #F5F7F9;
      /* Very light gray/blue tint */
      --card-white: #FFFFFF;
      /* Pure White */

      /* Brand Colors */
      --primary-green: #00E341;
      /* Vibrant Neon Green (Buttons/Active) */
      --primary-dark: #064E3B;
      /* Deep Green (Text/Contrast) */
      --accent-lime: #D1FAE5;
      /* Light Green Bg */

      /* Functional Colors */
      --alert-red: #EF4444;
      /* Danger */
      --alert-bg: #FEF2F2;
      /* Danger BG */
      --text-main: #111827;
      /* Gray 900 */
      --text-sub: #6B7280;
      /* Gray 500 */

      --safe-area-bottom: env(safe-area-inset-bottom);
    }

    body {
      font-family: 'DM Sans', 'Inter', sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 0px;
      background: transparent;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }


    /* Card Styles */
    .aura-card {
      background-color: var(--card-white);
      border-radius: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(0, 0, 0, 0.02);
    }

    .btn-primary {
      background-color: var(--primary-green);
      color: #000000;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(0, 227, 65, 0.3);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* Safe Area Utilities */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }

    .pb-safe-offset {
      padding-bottom: calc(env(safe-area-inset-bottom) + 20px);
    }

    .mb-safe {
      margin-bottom: env(safe-area-inset-bottom);
    }

    /* Animations */
    @keyframes ripple {
      0% {
        box-shadow: 0 0 0 0 rgba(0, 227, 65, 0.4);
      }

      70% {
        box-shadow: 0 0 0 20px rgba(0, 227, 65, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(0, 227, 65, 0);
      }
    }

    .animate-ripple {
      animation: ripple 2s infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    .animate-float {
      animation: float 4s ease-in-out infinite;
    }

    /* Scanner Overlay Corners */
    .scan-corner {
      position: absolute;
      width: 40px;
      height: 40px;
      border-color: var(--primary-green);
      border-width: 4px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 227, 65, 0.5);
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>

</head>
